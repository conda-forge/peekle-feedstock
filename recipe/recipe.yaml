schema_version: 1

context:
  version: "0.0.6"

package:
  name: peekle
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/peekle/peekle-${{ version }}.tar.gz
  sha256: 24b527934fd8856fce61aa784eb88c174bcb070bac33418218181ca83b307e42

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - peekle = peekle.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=69
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - peekle
      pip_check: true
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - peekle --help

about:
  summary: Peek into pickle files without importing unknown dependencies
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ecmwf/peekle/

extra:
  recipe-maintainers:
    - tjtg
    - jasonjunweilyu
    - HCookie
